# Expo projesini Android APK'ya çevirir ve "son-surum" yayınına yükler (indirme linki hep aynı kalır)
name: APK oluştur
on:
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Paketleri kur
        run: |
          npm install
          npx expo install expo@latest
          npx expo install --fix
          npx expo install --check || true
          echo "::notice::expo $(node -p "require('expo/package.json').version") / react-native $(node -p "require('react-native/package.json').version")"
      - name: Android SDK kontrol
        run: echo "::notice::ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms"
      - name: Android projesini oluştur
        run: npx expo prebuild --platform android --no-install
      - name: APK derle
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee build.log || {
            grep -A 25 "What went wrong" build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            grep -E "^e: |error:" build.log | head -15 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - name: Dosyayı adlandır
        run: cp android/app/build/outputs/apk/release/app-release.apk demir-fitness.apk
      - uses: actions/upload-artifact@v4
        with:
          name: demir-fitness-apk
          path: demir-fitness.apk
      - name: Son sürüm yayınına yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: son-surum
          name: Demir Fitness — son sürüm
          body: "Telefona indirip kur. (Bilinmeyen kaynaklardan yüklemeye izin vermen gerekebilir.)"
          files: demir-fitness.apk
          make_latest: true
