# Tarayıcı sürümünü gh-pages dalına koyar; GitHub Pages oradan yayınlar.
name: Web sürümü
on:
  push:
    branches: ["main"]
    paths-ignore: ["README.md", "docs/**", ".github/android-icons/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir site && cp -r index.html style.css app.js program.js manifest.json sw.js icons fonts site/ && touch site/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          commit_message: "Web sürümü güncellendi"
